<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f1f38" />
      <stop offset="100%" stop-color="#070b12" />
    </radialGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" stroke="#16253d" stroke-width="8" />

  <!-- 3D Lattice Framework (Isometric Cube with Centered Atom) -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Rear Bonds -->
    <line x1="0" y1="-140" x2="-120" y2="-70" stroke="#1e3a5f" stroke-width="5" stroke-dasharray="6,6" />
    <line x1="0" y1="-140" x2="120" y2="-70" stroke="#1e3a5f" stroke-width="5" stroke-dasharray="6,6" />
    <line x1="-120" y1="-70" x2="-120" y2="70" stroke="#1e3a5f" stroke-width="5" stroke-dasharray="6,6" />
    <line x1="120" y1="-70" x2="120" y2="70" stroke="#1e3a5f" stroke-width="5" stroke-dasharray="6,6" />

    <!-- Center Atom Bonds (BCC) -->
    <line x1="0" y1="0" x2="0" y2="-140" stroke="#38bdf8" stroke-width="4" opacity="0.8" />
    <line x1="0" y1="0" x2="-120" y2="-70" stroke="#38bdf8" stroke-width="4" opacity="0.8" />
    <line x1="0" y1="0" x2="120" y2="-70" stroke="#38bdf8" stroke-width="4" opacity="0.8" />
    <line x1="0" y1="0" x2="0" y2="140" stroke="#38bdf8" stroke-width="4" opacity="0.8" />
    <line x1="0" y1="0" x2="-120" y2="70" stroke="#38bdf8" stroke-width="4" opacity="0.8" />
    <line x1="0" y1="0" x2="120" y2="70" stroke="#38bdf8" stroke-width="4" opacity="0.8" />

    <!-- Front Bonds -->
    <line x1="0" y1="140" x2="-120" y2="70" stroke="url(#cyanLine)" stroke-width="6" />
    <line x1="0" y1="140" x2="120" y2="70" stroke="url(#cyanLine)" stroke-width="6" />
    <line x1="0" y1="-140" x2="0" y2="0" stroke="url(#cyanLine)" stroke-width="6" />
    <line x1="-120" y1="70" x2="0" y2="0" stroke="url(#cyanLine)" stroke-width="6" />
    <line x1="120" y1="70" x2="0" y2="0" stroke="url(#cyanLine)" stroke-width="6" />

    <!-- Corner Atoms -->
    <circle cx="0" cy="-140" r="22" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />
    <circle cx="-120" cy="-70" r="22" fill="#0284c7" stroke="#38bdf8" stroke-width="3" />
    <circle cx="120" cy="-70" r="22" fill="#0284c7" stroke="#38bdf8" stroke-width="3" />
    <circle cx="-120" cy="70" r="22" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />
    <circle cx="120" cy="70" r="22" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />
    <circle cx="0" cy="140" r="22" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />

    <!-- Body Centered Interstitial / Core Atom -->
    <circle cx="0" cy="0" r="30" fill="#06b6d4" stroke="#ffffff" stroke-width="4" />
    <circle cx="-6" cy="-6" r="8" fill="#ffffff" opacity="0.7" />
  </g>
</svg>
